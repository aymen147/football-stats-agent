[project]
name = "football-stats-agent"
version = "0.1.0"
description = "LangGraph agent that answers natural-language questions about Ligue 1 match statistics, with its tools also exposed through an MCP server and guarded against prompt injection."
authors = [
    { name = "Aymen Ben Chaabane", email = "99889462+aymen147@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.19",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
football-agent = "football_stats_agent.cli:main"
football-mcp-server = "football_stats_agent.mcp_server:main"
football-mcp-demo = "football_stats_agent.mcp_client:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
